AutoName: Auto Type X1

Summary: Bluetooth HID keyboard emulator with human-like typing profiles

Description: |
  AutoType X1 turns your Android device into a physical Bluetooth keyboard
  that types into any paired computer — Windows, Linux, or macOS — with
  configurable human-like timing.

  Features:
  * Bluetooth Classic HID keyboard emulation (no root required)
  * Human-like typing profiles: Natural, Casual, Professional, Speed Demon
  * Multiline script support with Enter key transmission
  * Full US QWERTY layout
  * Background typing via foreground service
  * Save multiple named scripts for reuse
  * Material 3 UI with light, dark, and system theme
  * Fully offline — no internet, no accounts, no tracking

